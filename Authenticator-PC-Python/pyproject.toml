[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "authenticator-desktop"
version = "1.4.20"
description = "Local Windows desktop authenticator"
requires-python = ">=3.11"
dependencies = [
  "paramiko>=3.5,<4",
  "pywebview==6.2.1",
  "pythonnet==3.1.0",
  "tkwebview2==3.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["build", "release", "__pycache__", ".venv-build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["app.py", "application", "domain", "infrastructure", "presentation"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["presentation.mixins.*"]
disable_error_code = ["arg-type", "call-overload", "has-type", "attr-defined", "call-arg"]

[[tool.mypy.overrides]]
# Paramiko currently ships without complete type stubs. It remains isolated in
# the SSH infrastructure adapter, whose public surface is checked normally.
module = ["infrastructure.ssh_sessions"]
disable_error_code = ["import-untyped"]
