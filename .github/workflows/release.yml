name: Build and update latest release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: authenticator-latest-release
  cancel-in-progress: true

jobs:
  build-pc:
    name: Build Windows desktop package
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Authenticator-PC-Python
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: Authenticator-PC-Python/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Authenticator-PC-Python/frontend/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip; python -m pip install -r requirements.txt

      - name: Build the EXE and run the packaged checks
        env:
          PYTHONUTF8: '1'
        run: python build_exe.py

      - name: Create desktop checksums
        run: |
          $file = 'release/AuthenticatorDesktop.exe'
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash
          "$hash  AuthenticatorDesktop.exe" | Out-File -Encoding ascii release/SHA256SUMS-PC.txt

      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: authenticator-pc
          path: |
            Authenticator-PC-Python/release/AuthenticatorDesktop.exe
            Authenticator-PC-Python/release/SHA256SUMS-PC.txt
          if-no-files-found: error

  build-android:
    name: Build Android package
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Authenticator-Mobile-Android
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python 3.11 for Chaquopy
        uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: pwsh
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          "sdk.dir=$env:ANDROID_SDK_ROOT" | Out-File -Encoding ascii local.properties

      - name: Build and test the APK
        env:
          AUTHENTICATOR_PYTHON311: ${{ steps.python.outputs.python-path }}
        run: .\gradlew.bat --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Prepare Android package and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $source = 'app/build/outputs/apk/debug/app-debug.apk'
          $target = 'release/AuthenticatorMobile-1.4.25-arm64-v8a-debug.apk'
          Copy-Item -LiteralPath $source -Destination $target -Force
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $target).Hash
          "$hash  AuthenticatorMobile-1.4.25-arm64-v8a-debug.apk" | Out-File -Encoding ascii release/SHA256SUMS-Android.txt

      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: authenticator-android
          path: |
            Authenticator-Mobile-Android/release/AuthenticatorMobile-1.4.25-arm64-v8a-debug.apk
            Authenticator-Mobile-Android/release/SHA256SUMS-Android.txt
          if-no-files-found: error

  publish:
    name: Update GitHub latest release
    needs: [build-pc, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download desktop package
        uses: actions/download-artifact@v4
        with:
          name: authenticator-pc
          path: release

      - name: Download Android package
        uses: actions/download-artifact@v4
        with:
          name: authenticator-android
          path: release

      - name: Write release checksums
        run: sha256sum release/* > release/SHA256SUMS.txt

      - name: Replace latest release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Authenticator latest
          body: |
            Automated build from `${{ github.sha }}`.

            Assets:
            - Windows desktop EXE
            - Android arm64-v8a debug APK
            - SHA-256 checksum files
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release/AuthenticatorDesktop.exe
            release/AuthenticatorMobile-1.4.25-arm64-v8a-debug.apk
            release/SHA256SUMS-PC.txt
            release/SHA256SUMS-Android.txt
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
